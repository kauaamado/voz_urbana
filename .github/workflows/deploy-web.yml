# Publica o build web na Hostgator (/voz_urbana/) quando uma tag vX.Y.Z é enviada.
# Secrets necessários (Settings > Secrets and variables > Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
name: Deploy web (Voz Urbana)

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build web
        run: flutter build web --release --base-href /voz_urbana/

      # A Hostgator serve o site via Cloudflare, que guarda .js por 4h.
      # Versionar a URL dos arquivos de entrada força o download da versão nova.
      - name: Cache-busting (Cloudflare)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          sed -i "s|src=\"flutter_bootstrap.js\"|src=\"flutter_bootstrap.js?v=$VERSION\"|" build/web/index.html
          sed -i "s|\"mainJsPath\":\"main.dart.js\"|\"mainJsPath\":\"main.dart.js?v=$VERSION\"|" build/web/flutter_bootstrap.js
          grep -q "flutter_bootstrap.js?v=$VERSION" build/web/index.html
          grep -q "main.dart.js?v=$VERSION" build/web/flutter_bootstrap.js

      - name: Enviar via FTPS
        uses: SamKirkland/FTP-Deploy-Action@3a9c65ae0fc12ac924ccef8afc26941cc43aad0b # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./build/web/
          server-dir: ./
